<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pump Log</title>

<!-- This is the one tag Apps Script itself can never add to its own page (see
     the app's Code.gs for the full explanation). A plain static host has no
     such restriction, so iOS picks this up correctly on "Add to Home Screen". -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pump Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF7F1">

<!-- The app is embedded here rather than redirected to. That matters for two
     reasons:
     1. This page (on github.io) never navigates away, so "Add to Home Screen"
        always captures ITS icon -- no timing race like the first version had.
     2. iOS drops a standalone home-screen app out of fullscreen mode and back
        into Safari's browser chrome the moment the TOP-LEVEL page crosses to a
        different domain. A redirect to script.google.com did exactly that.
        Embedding the app in an iframe means the top-level page stays on
        github.io the whole time, so that trigger never fires.
     Apps Script's own doGet() sets XFrameOptionsMode.ALLOWALL (see Code.gs),
     which -- per Google's own docs -- removes the X-Frame-Options header
     specifically so a page like this one is allowed to embed it. -->
<style>
  html, body { margin: 0; height: 100%; background: #FAF7F1; }
  iframe { border: none; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbxuGpuW9uzpKp97sc9vTkFS5o_1WoonL7_q9fH0SH-HJJAZ3Dy29LtqreUofuBLp238/exec" title="Pump Log"></iframe>
</body>
</html>
